<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon élevage</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--rp:999px;--rc:20px;--ri:14px;--bw:1px;--bw2:2px;--bc:var(--line);--sh:none;--ff:'Bricolage Grotesque',system-ui,sans-serif;--fh:var(--ff);--mono:var(--ff);--a:#2E6B3F;--a2:#7CC58D;--bg:#FFFFFF;--fill:#F4F6F3;--sf:#fff;--ink:#1C2320;--mute:#5D6A63;--line:#E6E9E5;--on:#fff;--accent:var(--a);--pad:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-accent="vanille"]{--a:#8A5F00;--a2:#E8B948}
:root[data-accent="lagon"]{--a:#17708A;--a2:#6CC3DC}
:root[data-accent="bougainvillee"]{--a:#A3316B;--a2:#E58DB8}
:root[data-density="compact"]{--pad:11px}
:root[data-size="s"]{font-size:14px}
:root[data-size="l"]{font-size:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--fill:#101512;--sf:#182019;--ink:#E9EFEA;--mute:#9AA79F;--line:#2A342E;--on:#0F1411;--accent:var(--a2)}}
:root[data-theme="dark"]{--bg:#101512;--fill:#101512;--sf:#182019;--ink:#E9EFEA;--mute:#9AA79F;--line:#2A342E;--on:#0F1411;--accent:var(--a2)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:1rem;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:22px var(--pad) 100px}
.view{display:none}.view.on{display:block}
h1{font-size:1.9rem;line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:0 0 1.1rem}
h2{font-size:1.1rem;font-weight:700;margin:1.6rem 0 .7rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--accent);color:var(--on);border-radius:var(--rc);padding:calc(var(--pad)*1.4)}
.hero .big{font-size:1.6rem;font-weight:800;line-height:1.1}
.hero p{margin:.4rem 0 1.1rem;max-width:30ch;opacity:.92}
.btn{font:inherit;font-weight:600;border:0;border-radius:var(--rp);padding:.7rem 1.3rem;background:var(--on);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sf);border:var(--bw) solid var(--bc);border-radius:var(--rc);padding:var(--pad)}
.tile .e{font-size:1.9rem;display:block}
.tile b{display:block;margin-top:.2rem}
.tile small,.row small,.set small{color:var(--mute)}
.tile .n{font-size:1.6rem;font-weight:800;margin:.3rem 0 .1rem}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:var(--bw) solid var(--bc);border-radius:var(--ri);padding:var(--pad);margin-bottom:8px}
.row .e{font-size:1.7rem}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:var(--rp);border:var(--bw) solid var(--bc);background:var(--fill);color:var(--ink);font:inherit;font-size:1.15rem}
.step output{min-width:2ch;text-align:center;font-weight:800}
.in{font:inherit;width:100%;padding:.65rem .8rem;border-radius:var(--ri);border:var(--bw) solid var(--bc);background:var(--fill);color:var(--ink)}
.sm{width:5.6rem;text-align:right}
.set{background:var(--sf);border:var(--bw) solid var(--bc);border-radius:var(--rc);padding:var(--pad);margin-bottom:12px}
.set .lb{display:block;font-weight:600;margin-bottom:.55rem}
.set small{display:block;margin-top:.45rem}
.seg{display:flex;background:var(--fill);border:var(--bw) solid var(--bc);border-radius:var(--rp);padding:3px;gap:2px}
.seg button{flex:1;font:inherit;font-size:.9rem;border:0;background:none;color:var(--mute);padding:.5rem .3rem;border-radius:var(--rp)}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{border:var(--bw2) solid var(--bc);background:var(--fill);border-radius:var(--ri);padding:.6rem .2rem;font:inherit;font-size:.78rem;color:var(--ink)}
.sw button.on{border-color:var(--accent);font-weight:600}
.sw i{display:block;width:28px;height:28px;border-radius:var(--rp);margin:0 auto .35rem}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.line .lb{margin:0}
.tg{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:var(--rp);background:var(--line);position:relative;margin:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:var(--rp);background:var(--sf);transition:transform .15s}
.tg:checked{background:var(--accent)}
.tg:checked::after{transform:translateX(20px);background:var(--on)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:var(--bw) solid var(--bc);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;font:inherit;border:0;background:none;color:var(--mute);padding:.55rem 0 .6rem}
nav button span{display:block;font-size:1.3rem;line-height:1.2}
nav button em{font-style:normal;font-size:.72rem}
nav button.on{color:var(--accent);font-weight:700}
.sub{color:var(--mute);margin:.5rem 0 1rem}.fld{margin-bottom:1rem}
.go{width:100%;background:var(--accent);color:var(--on);border:0;border-radius:var(--rp);font:inherit;font-weight:700;padding:.85rem;margin-top:.4rem}
.warn{background:var(--fill);border-radius:var(--ri);padding:.6rem .8rem;font-size:.9rem;margin-top:12px}
.res{background:var(--sf);border:var(--bw) solid var(--bc);border-left:6px solid var(--accent);border-radius:var(--rc);padding:var(--pad);margin-top:14px}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:.6rem}.rh b{font-size:1.25rem}.rh small{color:var(--mute)}
.chip{background:var(--fill);border:var(--bw) solid var(--bc);border-radius:var(--rp);padding:.2rem .7rem;font-size:.85rem;white-space:nowrap}
.kv div{padding:.15rem 0}
.ing{margin-top:.8rem;background:var(--fill);border-radius:var(--ri);padding:.6rem .8rem}
.ing div{display:flex;justify-content:space-between;gap:10px;padding:.45rem 0;border-bottom:1px dashed var(--line)}.ing div:last-child{border:0}.ing .tot{font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stats div{background:var(--fill);border-radius:var(--ri);padding:.7rem}.stats b{display:block;font-size:1.05rem;color:var(--accent)}.stats small{color:var(--mute)}
.ig{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ig .in:first-child{flex:1;min-width:0}
.ig button{width:36px;height:36px;border-radius:var(--rp);border:var(--bw) solid var(--bc);background:var(--fill);color:var(--ink);flex:none}
.add{width:100%;font:inherit;font-weight:600;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:var(--ri);padding:.65rem}
.ghost{font:inherit;font-weight:600;border:var(--bw2) solid var(--bc);background:none;color:var(--ink);border-radius:var(--rp);padding:.7rem}
.det{margin-top:.8rem}.det summary{color:var(--mute);cursor:pointer;margin-bottom:.4rem}
.opts{display:grid;gap:8px}
.opt{display:block;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:var(--bw2) solid var(--bc);border-radius:var(--ri);padding:.75rem .9rem}
.opt b{display:block}.opt small{color:var(--mute);margin-top:.15rem}
.opt.on{border-color:var(--accent);background:var(--fill)}

.hero,.res,.go{box-shadow:var(--sh)}
h1,h2,.hero .big,.rh b{font-family:var(--fh)}
.in[type=number],.ing div span:last-child,.stats b,.tile .n{font-family:var(--mono)}
:root[data-style="brut"]{--rp:0;--rc:0;--ri:0;--bw:2px;--bw2:2px;--bc:var(--ink);--sh:5px 5px 0 var(--ink);--ff:'Space Grotesk',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;--accent:var(--a);--on:#111}
:root[data-style="brut"][data-accent="riziere"]{--a:#8BE28B}
:root[data-style="brut"][data-accent="vanille"]{--a:#FFC61A}
:root[data-style="brut"][data-accent="lagon"]{--a:#5AC8FA}
:root[data-style="brut"][data-accent="bougainvillee"]{--a:#FF8FC0}
:root[data-style="brut"] .lb{text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
:root[data-style="brut"] .go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
:root[data-style="journal"]{--rp:4px;--rc:4px;--ri:3px;--bw2:1px;--fh:'Fraunces',Georgia,serif}
:root[data-style="journal"] h1{font-weight:600;letter-spacing:-.01em}
:root[data-style="journal"] .hero{background:transparent;color:var(--ink);border-top:3px double var(--ink);border-bottom:1px solid var(--ink);border-radius:0;padding-left:0;padding-right:0}
:root[data-style="journal"] .hero .btn{background:var(--accent);color:var(--on)}
:root[data-style="bulle"]{--rp:999px;--rc:30px;--ri:22px;--bw:0px;--sh:0 8px 20px rgba(40,60,50,.12);--ff:'Nunito',system-ui,sans-serif}
:root[data-style="bulle"] body{background:color-mix(in srgb,var(--accent) 9%,var(--bg));font-weight:600}
:root[data-style="bulle"] .set,:root[data-style="bulle"] .res{box-shadow:var(--sh)}
:root[data-style="bulle"] .in{background:var(--fill)}

body.lock{overflow:hidden}
#res.open{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#res.open .res{max-width:480px;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:none;padding:var(--pad) var(--pad) 32px}
.bar{position:sticky;top:0;z-index:1;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 10px;border-bottom:var(--bw) solid var(--bc)}
.backbtn{font:inherit;font-size:1.05rem;font-weight:700;background:none;border:0;color:var(--accent);padding:.4rem 0}
#err:empty{display:none}
.ing div span:last-child{white-space:nowrap;flex:none;text-align:right}
.ig{flex-wrap:wrap;margin-bottom:14px}
.ig .in:first-child{flex:1 1 100%}
.ig .sm{margin-left:0}
.ig select.in{width:5rem;flex:none}
.ig .pc{flex:1;text-align:right;color:var(--mute);white-space:nowrap;font-size:.9rem}
.ig{padding-bottom:12px;border-bottom:1px dashed var(--line)}
.pr{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--mute)}
.pr .in{width:7.5rem}.pr em{font-style:normal}
</style>
</head>
<body>
<main>
  <section class="view" id="v-home">
    <h1 class="fn">Ma ferme</h1>
    <div class="hero">
      <div class="big">Ration du jour</div>
      <p>Calculez la nourriture de vos poulets selon leur âge.</p>
      <button class="btn" data-tab="calc">Calculer une ration</button>
    </div>
    <div id="today"></div>
  </section>
  <section class="view" id="v-calc">
    <div class="line"><h1 data-i="title" style="margin:0">Ration des poulets</h1>
      <div class="seg"><button data-key="lang" data-v="mg">Malagasy</button><button data-key="lang" data-v="fr">Français</button></div></div>
    <p class="sub" data-i="sub"></p>
    <div class="set">
      <div class="fld"><span class="lb" data-i="q"></span><div class="opts">
        <button class="opt" data-key="mode" data-v="ready"><b data-i="mr"></b><small data-i="mrs"></small></button>
        <button class="opt" data-key="mode" data-v="raw"><b data-i="mm"></b><small data-i="mms"></small></button></div></div>
      <div class="fld"><label class="lb" for="c-age" data-i="age"></label><input class="in" id="c-age" type="number" inputmode="numeric" min="1" max="14" data-f="c:age"><small id="h-age"></small></div>
      <div class="fld"><label class="lb" for="c-n" data-i="n"></label><input class="in" id="c-n" type="number" inputmode="numeric" min="1" data-f="c:n"></div>
      <div class="fld"><label class="lb" for="c-days" data-i="days"></label><input class="in" id="c-days" type="number" inputmode="numeric" min="1" data-f="c:days"></div>
      <button class="go" data-go="1" data-i="go"></button>
      <div class="warn" id="err"></div>
    </div>
    <div id="res"></div>
  </section>
  <section class="view" id="v-formula">
    <div class="line"><h1 data-i="n_formula" style="margin:0">Formule</h1>
      <div class="seg"><button data-key="lang" data-v="mg">Malagasy</button><button data-key="lang" data-v="fr">Français</button></div></div>
    <p class="sub" data-i="fsub"></p>
    <div class="set">
      <span class="lb" data-i="noRec"></span>
      <div class="opts">
        <button class="opt" type="button" data-preset="balanced"><b data-i="presetBal"></b><small data-i="presetBalSub"></small></button>
        <button class="opt" type="button" data-preset="eco"><b data-i="presetEco"></b><small data-i="presetEcoSub"></small></button>
      </div>
      <div class="warn" data-i="presetNote"></div>
      <div class="warn" id="presetConfirmBox" hidden>
        <p id="presetConfirmText" style="margin:0 0 .6rem"></p>
        <div style="display:flex;gap:8px">
          <button class="go" type="button" id="presetYesBtn" data-pconfirm="yes" style="margin:0;flex:1"></button>
          <button class="ghost" type="button" id="presetNoBtn" data-pconfirm="no" style="flex:1"></button>
        </div>
      </div>
    </div>
    <div class="set"><div id="ings"></div><button class="add" data-add="1" data-i="add"></button><small id="ftot"></small></div>
    <div class="set"><label class="lb" for="batch" data-i="batch"></label><input class="in" id="batch" type="number" step="any" min="0" inputmode="decimal" data-f="batch"><small data-i="batchh"></small>
      <div class="ing" id="batch-res"></div></div>
    <div class="set"><label class="lb" for="wf" data-i="wf"></label><input class="in" id="wf" type="number" step="0.1" min="0" data-f="wf"><small data-i="wfh"></small></div>
    <div class="set"><span class="lb" data-i="pr_t"></span>
      <div class="fld"><label class="lb" for="pd" data-i="pd"></label><input class="in" id="pd" type="number" step="any" min="0" inputmode="decimal" data-f="pd"></div>
      <div class="fld"><label class="lb" for="sd" data-i="sd"></label><input class="in" id="sd" type="number" step="any" min="0" inputmode="decimal" data-f="sd"></div>
      <div class="fld"><label class="lb" for="cur" data-i="cur"></label><input class="in" id="cur" maxlength="6" data-f="cur"></div>
      <small data-i="prh"></small></div>
  </section>
  <section class="view" id="v-settings">
    <h1 data-i="n_settings">Préférences</h1>
    <div class="set"><label class="lb" for="farm">Nom de la ferme</label><input class="in" id="farm" data-f="farm" maxlength="30"></div>
    <div class="set"><span class="lb">Personnalité</span><div class="opts">
      <button class="opt" data-key="style" data-v="classique"><b>Classique</b><small>Doux, arrondi, vert rizière</small></button>
      <button class="opt" data-key="style" data-v="brut"><b>Brut</b><small>Carré, contours épais, couleurs vives</small></button>
      <button class="opt" data-key="style" data-v="journal"><b>Journal</b><small>Sobre, comme une page de carnet</small></button>
      <button class="opt" data-key="style" data-v="bulle"><b>Bulle</b><small>Très rond et joyeux</small></button></div></div>
    <div class="set"><span class="lb">Couleur</span>
      <div class="sw" data-key="accent">
        <button data-key="accent" data-v="riziere"><i style="background:#2E6B3F"></i>Rizière</button>
        <button data-key="accent" data-v="vanille"><i style="background:#E8B948"></i>Vanille</button>
        <button data-key="accent" data-v="lagon"><i style="background:#17708A"></i>Lagon</button>
        <button data-key="accent" data-v="bougainvillee"><i style="background:#A3316B"></i>Bougainvillée</button>
      </div></div>
    <div class="set"><span class="lb">Apparence</span>
      <div class="seg"><button data-key="theme" data-v="light">Clair</button><button data-key="theme" data-v="dark">Sombre</button><button data-key="theme" data-v="auto">Auto</button></div></div>
    <div class="set"><span class="lb">Taille du texte</span>
      <div class="seg"><button data-key="size" data-v="s">Petit</button><button data-key="size" data-v="m">Normal</button><button data-key="size" data-v="l">Grand</button></div></div>
    <div class="set"><span class="lb">Densité</span>
      <div class="seg"><button data-key="density" data-v="roomy">Aérée</button><button data-key="density" data-v="compact">Compacte</button></div></div>
    <div class="set"><span class="lb">Unité de poids</span>
      <div class="seg"><button data-key="unit" data-v="kg">kg</button><button data-key="unit" data-v="g">g</button><button data-key="unit" data-v="lb">lb</button></div></div>
    <div class="set"><label class="lb" for="lang">Langue</label>
      <select class="in" id="lang" data-f="lang"><option value="fr">Français</option><option value="mg">Malagasy</option></select>
      <small>Traduit : navigation et calcul de ration.</small></div>
    <div class="set"><div class="line"><label class="lb" for="rem" data-i="remLbl">Rappel des repas</label><input type="checkbox" class="tg" id="rem" data-f="remind"></div>
      <small data-i="remSub">Heure du premier repas</small><input class="in" type="time" id="time" data-f="time" style="margin-top:.4rem">
      <small id="remStatus" style="display:block;margin-top:.5rem"></small></div>
  </section>
</main>
<nav><div>
  <button data-tab="home"><span>🏡</span><em data-i="n_home">Accueil</em></button>
  <button data-tab="calc"><span>🧮</span><em data-i="n_calc">Calcul</em></button>
  <button data-tab="formula"><span>🧪</span><em data-i="n_formula">Formule</em></button>
  <button data-tab="settings"><span>⚙️</span><em data-i="n_settings">Préférences</em></button>
</div></nav>
<script>

  <div class="ing"><b>${t.fo(d)}</b>${S.mode==="raw"?ing:""}<div class="tot"><span>${S.mode==="raw"?"🔁 "+t.tot:"🥣 "+t.starter} (${d} ${t.dd})</span><span>${w(tot)}</span></div><div><span>💧 ${t.wtot(d)}</span><span>${wat(tot)}</span></div>${hasC?`<div><span>${t.cost(d)}</span><span>${money(cost)}</span></div><div><span>${t.cpk}</span><span>${money(cpk)}</span></div>`:""}</div>
  ${stk}${bad}${miss>0?`<div class="warn">${t.miss(miss)}</div>`:""}
  <details class="det"><summary>${t.det}</summary><div class="ing">${det}</div></details>
  <div class="stats"><div><small>${t.pig}</small><b>${w(rate(a))}</b></div><div><small>${t.all(n)}</small><b>${w(rate(a)*n)}</b></div>
  <div><small>${t.wpig}</small><b>${wat(rate(a))}</b></div><div><small>${t.wall(n)}</small><b>${wat(rate(a)*n)}</b></div>${hasC?`<div><small>${t.cpig}</small><b>${money(cpk*rate(a)/1000)}</b></div><div><small>${t.call(n)}</small><b>${money(cpk*rate(a)*n/1000)}</b></div>`:""}</div></div>`;el.classList.add("open");document.body.classList.add("lock")}
apply();render();
</script>
